<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" role="img" aria-label="Easy Appointment icon">
  <title>Easy Appointment — Icon</title>
  <style>
    :root { --ea-start: #06b6d4; --ea-end: #6366f1; --ea-text: #0f172a; }
    .ea-brand { fill: url(#ea-grad); }
    .ea-inner { fill: #ffffff; }
  </style>
  <defs>
    <linearGradient id="ea-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--ea-start)"/>
      <stop offset="100%" stop-color="var(--ea-end)"/>
    </linearGradient>
    <filter id="ea-soft" x="-20%" y="-20%" width="140%" height="140%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Rounded square badge -->
  <rect x="16" y="16" width="160" height="160" rx="32" class="ea-brand" filter="url(#ea-soft)"/>

  <!-- Calendar with checkmark -->
  <g transform="translate(40,44)">
    <!-- Calendar body -->
    <rect x="0" y="20" width="112" height="88" rx="14" class="ea-inner"/>
    <!-- Binding rings -->
    <rect x="6" y="0" width="20" height="28" rx="6" class="ea-inner"/>
    <rect x="86" y="0" width="20" height="28" rx="6" class="ea-inner"/>
    <!-- Check mark -->
    <path d="M30 74 l16 16 l40 -40" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Subtle spark accent -->
    <path d="M88 38 q6 -6 12 0 q-6 6 -12 0z" fill="#22d3ee" opacity="0.9"/>
  </g>
</svg>
